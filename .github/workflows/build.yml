name: Windows build and installer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Package installer
        shell: pwsh
        run: ./scripts/package.ps1 -SkipBuild
      - uses: actions/upload-artifact@v4
        with:
          name: worship-pptx-windows
          path: |
            dist/*.msi
            dist/*.zip
            dist/SHA256SUMS.txt
